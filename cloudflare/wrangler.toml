name = "brivu"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 and R2 bindings are managed in Cloudflare Dashboard (Settings > Bindings):
# - DB -> brivu-db (D1)
# - R2_BUCKET -> brivu-files (R2)

# Optional environment variables
[vars]
ENVIRONMENT = "production"
# Uncomment and set a secret key if you want to require authorization for sync/upload:
# SYNC_SECRET_KEY = "your-custom-secret-key"

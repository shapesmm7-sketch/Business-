workflows:
  android-debug:
    name: QuickReceipt Android Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Vite web application
        script: |
          npm run build
      - name: Configure google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Successfully injected google-services.json from Codemagic environment"
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using existing android/app/google-services.json"
          else
            echo "Notice: google-services.json not found in android/app"
          fi
      - name: Sync web assets to Capacitor Android
        script: |
          npx cap sync android
      - name: Set permissions for Gradle Wrapper
        script: |
          chmod +x android/gradlew
      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - tabsmrman@gmail.com
        notify:
          success: true
          failure: true

workflows:
  android-debug:
    name: QuickReceipt Android Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Vite web application
        script: |
          npm run build
      - name: Sync web assets to Capacitor Android
        script: |
          npx cap sync android
      - name: Set permissions for Gradle Wrapper
        script: |
          cd android
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - tabsmrman@gmail.com
        notify:
          success: true
          failure: true

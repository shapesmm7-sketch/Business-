name = "brivu"
main = "src/worker.ts"
compatibility_date = "2024-10-06"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/qr", "/qr/*", "/menu", "/menu/*", "/api/*"]

[build]
command = "npm run build"

[vars]
# Set your Google Cloud Web Application OAuth 2.0 Client ID from Project "Brivu" (97897075021)
GOOGLE_WEB_CLIENT_ID = ""

# R2 Object Storage Bucket Binding (Preserved across all deploys)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "brivu-files"

# D1 SQL Database Binding (Preserved across all deploys)
[[d1_databases]]
binding = "DB"
database_name = "brivu-db"
database_id = "add56248-d8bf-46ba-9373-9a65037c0e55"

